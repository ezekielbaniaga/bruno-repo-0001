info:
  name: List User Sessions
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users/{{userId}}/sessions"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.length > 0) {
          bru.setEnvVar("userSessionId", res.body[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Stores the first session as `userSessionId`.
