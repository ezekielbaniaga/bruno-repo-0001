info:
  name: Get User
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/{{userId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("userVersion", String(res.body.version));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
