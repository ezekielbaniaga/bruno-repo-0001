info:
  name: Change Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/users/me/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "{{newPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 204) {
          bru.setEnvVar("refreshToken", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Changes the password of the logged-in user from `password` to the secret `newPassword`. 204 revokes every session, so update `password` and log in again. 400 INVALID_CURRENT_PASSWORD / INVALID_PASSWORD.
