info:
  name: Revoke My Session
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/users/me/sessions/{{sessionId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 204, also when already revoked. 404 SESSION_NOT_FOUND if the session isn't yours.
