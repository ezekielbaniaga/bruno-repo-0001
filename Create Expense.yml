info:
  name: Create Expense
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/api/expense
  body:
    type: json
    data: |-
      {
          "description": "Test Food Item",
          "amount": 29.00,
          "category":"food",
          "date":"2026-07-15"
