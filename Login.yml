info:
  name: Login
  type: http
  seq: 12

http:
  method: POST
  url: http://localhost:8080/auth/login
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "devpassword"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let token = res.body.accessToken
        bru.setEnvVar("jwtToken", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
