info:
  name: Refresh
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("jwtToken", res.body.accessToken);
          bru.setEnvVar("refreshToken", res.body.refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Rotates the refresh token. Reusing an old one revokes the whole session.
