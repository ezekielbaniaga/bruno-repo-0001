info:
  name: Get Archived Expenses
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/expense/archived"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.expenses.length > 0) {
          bru.setEnvVar("archivedExpenseId", res.body.expenses[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Stores the first archived expense as `archivedExpenseId` for Update Archived Expense.
