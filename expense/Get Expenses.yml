info:
  name: Get Expenses
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/expense"
  headers:
    - name: X-API-Version
      value: "1.1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "v1.1: `{ expenses, count, total_amount }`."
