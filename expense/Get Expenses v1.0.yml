info:
  name: Get Expenses v1.0
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/expense"
  headers:
    - name: X-API-Version
      value: "1.0"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "v1.0, also the default without the header: `{ expenses, total }`, where total is the count."
